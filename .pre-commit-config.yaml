default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.cassette\.yaml$
      - id: end-of-file-fixer
        exclude: \.cassette\.yaml$
      - id: check-yaml
        args: [--unsafe]  # allow custom tags (e.g. !env in docker compose)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict on src/forge)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
