name: Clean install

# A run's machine installs strata-forge FRESH, with no lockfile and no constraints, so it resolves
# against whatever the index published that morning. This job performs that same install every
# night and builds every config a run builds (scripts/smoke_clean_install.py), so a breaking
# upstream release fails here instead of on a user's GPU after provisioning has been paid for.
#
# Kept out of nightly.yml on purpose: a manual run of this job (the override drill below, or a
# re-check after a pin change) must not also re-record cassettes against live providers or open a
# bot pull request, which a dispatch of nightly.yml does.
#
# It holds no secret and installs only from the public index: read-only token, credentials not
# persisted into the checkout, no repository or user uv config, the default index named
# explicitly, and nothing reaches the Hugging Face Hub (the smoke runs with HF_HUB_OFFLINE=1).

on:
  schedule:
    - cron: "30 6 * * *"  # 06:30 UTC daily, after nightly.yml
  workflow_dispatch:
    inputs:
      override:
        description: >-
          Requirements forced over the resolution, space-separated (uv --override). A drill:
          `transformers==4.57.6 huggingface-hub==0.36.0` must turn the finetuning legs red.
        required: false
        default: ""
  # A pin change is verified on the branch that makes it, before it reaches dev. Tag pushes are
  # excluded by naming branches: path filters are not evaluated for tags.
  push:
    branches: ["**"]
    paths:
      - pyproject.toml
      - scripts/smoke_clean_install.py
      - .github/workflows/clean-install.yml

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  INDEX_URL: https://pypi.org/simple

jobs:
  smoke:
    name: clean install [${{ matrix.extras }}]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The extras strings strata-server installs on a run's machine, verbatim
        # (`_INFERENCE_EXTRAS` / `_FINETUNE_EXTRAS` in its run_tasks.py), plus `all`. This list IS
        # what a VM installs: when the server's strings change, this matrix changes with them.
        extras:
          - "serving,storage,hf"  # batch-inference machine
          - "finetuning,storage"  # fine-tuning machine
          - "all"
    steps:
      # vLLM, torch and the CUDA wheels together approach 10 GB; the runner's preinstalled SDKs
      # would otherwise turn a full disk into a false alarm.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The schedule runs from the default branch; the engine it exercises is dev, which is what
      # staging installs and what the next release is cut from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - run: uv python install "$PYTHON_VERSION"

      - name: Create an empty venv
        run: uv venv --no-config --python "$PYTHON_VERSION" "$RUNNER_TEMP/smoke-venv"

      # uv rather than the VM's pip only for speed: both resolve to the newest versions the
      # specifiers allow, which is the property under test.
      - name: Install strata-forge[${{ matrix.extras }}] with no lockfile and no constraints
        env:
          EXTRAS: ${{ matrix.extras }}
          OVERRIDE: ${{ inputs.override }}
        run: |
          override=()
          if [[ -n "${OVERRIDE}" ]]; then
            printf '%s\n' "${OVERRIDE}" | tr -s '[:space:]' '\n' > "$RUNNER_TEMP/override.txt"
            echo "::warning title=Override drill::resolving with: ${OVERRIDE}"
            override=(--override "$RUNNER_TEMP/override.txt")
          fi
          uv pip install --no-config --default-index "$INDEX_URL" \
            --python "$RUNNER_TEMP/smoke-venv/bin/python" "${override[@]}" ".[${EXTRAS}]"
          df -h /

      - name: Build every config a run builds
        env:
          EXTRAS: ${{ matrix.extras }}
        run: '"$RUNNER_TEMP/smoke-venv/bin/python" scripts/smoke_clean_install.py "$EXTRAS"'
