name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check

  type:
    name: Type (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run pyright

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Run tests (skip if no tests yet)
        run: |
          if find tests/unit -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest tests/unit --cov=forge --cov-report=xml
          else
            echo "No unit tests yet — skipping."
          fi

  vcr-replay:
    name: VCR replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Replay cassettes (skip if none yet)
        run: |
          if [ -d "tests/vcr/cassettes" ] && [ -n "$(ls -A tests/vcr/cassettes 2>/dev/null)" ]; then
            uv run pytest tests/vcr
          else
            echo "No cassettes yet — skipping VCR replay."
          fi
