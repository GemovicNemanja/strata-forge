[project]
name = "strata-forge"
version = "0.0.1"
description = "Typed, async-first baseline for AI/LLM experiments across major foundation-model providers."
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nemanja Gemovic", email = "nemanja.gemovic@wonder.so" },
]
keywords = [
    "llm",
    "ai",
    "agents",
    "evaluation",
    "fine-tuning",
    "rag",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "litellm>=1.55",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
    "anyio>=4.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/GemovicNemanja/strata-forge"
Repository = "https://github.com/GemovicNemanja/strata-forge"
Issues = "https://github.com/GemovicNemanja/strata-forge/issues"

[project.optional-dependencies]
redis = ["redis>=5.2"]
multimodal = ["pillow>=11.0"]
inspect = ["inspect-ai>=0.3"]
langfuse = ["langfuse>=2.50"]
hf = ["datasets>=3.1"]
evals = ["nltk>=3.9", "rouge-score>=0.1.2"]
rag = ["qdrant-client>=1.13", "rank-bm25>=0.2.2", "cohere>=5.13"]
compute = ["skypilot>=0.7", "asyncssh>=2.18"]
serving = ["vllm>=0.7"]
bedrock = ["boto3>=1.35"]
storage = [
    "fsspec>=2024.10",
    "s3fs>=2024.10",
    "gcsfs>=2024.10",
    "adlfs>=2024.7",
    "huggingface_hub>=0.27",
]
finetuning = [
    "torch>=2.5",
    "transformers>=4.46",
    "trl>=0.13",
    "peft>=0.13",
    "datasets>=3.1",
    "accelerate>=1.1",
]
all = [
    "strata-forge[redis,multimodal,inspect,compute,serving,storage,finetuning,langfuse,hf,evals,rag,bedrock]",
]

[project.scripts]
# Only the distribution-qualified name is installed: a bare `forge` binary would collide on PATH
# with any other package shipping one (the generic name is already taken on PyPI).
strata-forge = "strata_forge.cli.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_forge"]
# CLAUDE.md files are agent instructions for THIS repo, not user documentation, and they carry
# internal links that dangle once installed. The per-module README.md files stay — they document
# the public surface.
exclude = ["**/CLAUDE.md", "**/AGENTS.md"]

# An sdist is published to a public index, so it is an ALLOW-list: only the package, the license,
# and the readme. Without this, hatchling's default sweeps in everything not VCS-ignored — the test
# suite, examples, notebooks, docs, CI config, the agent-instruction files, and the lockfile.
[tool.hatch.build.targets.sdist]
# `only-include` (not `include`) is the strict allow-list: everything outside these paths is
# dropped. README / LICENSE / NOTICE / pyproject.toml / PKG-INFO are added by hatchling itself.
only-include = ["src/strata_forge"]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/.env*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-recording>=0.13",
    "hypothesis>=6.115",
    "syrupy>=4.7",
    "respx>=0.21",
    "pre-commit>=4.0",
    "marimo>=0.10",
    # Optional runtime extras pulled into dev so unit tests can exercise
    # multimodal helpers, the Redis cache backend, etc. without forcing
    # users to install them in production.
    "pillow>=11.0",
]

# ----------------------------- ruff -----------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtin-shadowing
    "C4",           # comprehensions
    "PIE",          # misc
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ASYNC",        # async
    "S",            # bandit
    "PT",           # pytest
    "TID",          # tidy imports
    "TCH",          # type-checking blocks
    "PTH",          # use pathlib
    "ERA",          # eradicate dead code
]
ignore = [
    "E501",  # line length is handled by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT004", "S105", "S106", "S107"]
"examples/**/*.py" = ["S101", "T201"]
"scripts/**/*.py" = ["S101", "T201"]
# marimo notebooks: a cell's trailing bare expression is its rendered output.
"notebooks/**/*.py" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["strata_forge"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Option/Argument are the documented way to declare CLI params.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

# ----------------------------- pyright -----------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "strict"
strict = ["src/strata_forge"]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

# ----------------------------- pytest -----------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "live: requires live API keys (skipped by default)",
    "redis: requires a running Redis instance",
    "slow: long-running test",
    "integration: requires the local Docker stack",
]

# ----------------------------- coverage -----------------------------
[tool.coverage.run]
source = ["src/strata_forge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
# Minimum overall line coverage. Per-module thresholds (e.g. llm/ >= 90%) are
# enforced inside the suite where appropriate.
fail_under = 85
