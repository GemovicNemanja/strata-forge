[project]
name = "strata-forge"
version = "0.2.0"
description = "Typed, async-first baseline for AI/LLM experiments across major foundation-model providers."
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nemanja Gemovic", email = "nemanja.gemovic@wonder.so" },
]
keywords = [
    "llm",
    "ai",
    "agents",
    "evaluation",
    "fine-tuning",
    "rag",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Every specifier carries an upper bound. This package is `pip install`-ed FRESH onto a user's own
# VM at run time with no lockfile, so an unbounded pin means each run resolves against whatever
# shipped that morning and a breaking upstream release lands as a mid-run crash on the user's
# hardware rather than as a red build here. Raise a ceiling deliberately, with the call sites
# checked against the new major -- never to make a resolver stop complaining.
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "litellm>=1.55,<2",
    "structlog>=24.4,<27",
    "tenacity>=9.0,<10",
    "typer>=0.15,<1",
    "anyio>=4.6,<5",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<16",
    "jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/GemovicNemanja/strata-forge"
Repository = "https://github.com/GemovicNemanja/strata-forge"
Issues = "https://github.com/GemovicNemanja/strata-forge/issues"

[project.optional-dependencies]
redis = ["redis>=5.2,<9"]
multimodal = ["pillow>=11.0,<13"]
inspect = ["inspect-ai>=0.3,<0.4"]
# The tracing/prompt/dataset stores use the module-level `propagate_attributes` the v4 SDK
# introduced; v2 and v3 are a different API surface, so the floor is the real constraint here.
langfuse = ["langfuse>=4.0,<5"]
hf = ["datasets>=4.0,<6"]
evals = ["nltk>=3.9,<4", "rouge-score>=0.1.2,<0.2"]
rag = ["qdrant-client>=1.13,<2", "rank-bm25>=0.2.2,<0.3", "cohere>=5.13,<8"]
compute = ["skypilot>=0.7,<1", "asyncssh>=2.18,<3"]
# vLLM is driven as a CLI (`vllm serve`), so the floor is about what it DRAGS IN rather than an API
# this package calls: 0.24 is the first release on the transformers>=5.5.3 line that `finetuning`
# also targets, and every vLLM minor pins torch exactly. Keep in lockstep with compute/serving.py's
# default setup string, which installs vLLM without consulting this file.
serving = ["vllm>=0.24,<1"]
bedrock = ["boto3>=1.35,<2"]
storage = [
    # Do NOT raise the s3fs/gcsfs floors: `datasets` caps fsspec, and the 2026.7+ line of these two
    # requires an fsspec that cap excludes, which makes [storage,hf] unsatisfiable outright.
    "fsspec>=2024.10,<2027",
    "s3fs>=2024.10,<2027",
    "gcsfs>=2024.10,<2027",
    "adlfs>=2024.7,<2027",
    "huggingface_hub>=1.0,<2",
]
finetuning = [
    # torch below 2.9 publishes no cp314 wheel, and this package requires 3.14.
    "torch>=2.9,<3",
    # transformers 5 REMOVED `TrainingArguments.warmup_ratio` (folded into `warmup_steps`, which now
    # takes a float in [0,1) as a ratio). The training configs forward the new name, so 4.x is no
    # longer accepted. Capping at <5 instead would be worse than it looks: vLLM >=0.24 requires
    # transformers>=5.5.3, so `<5` silently backtracks [serving] onto a months-old vLLM/torch.
    "transformers>=5.5.3,<6",
    # TRL 1.0 is where the stable core (SFT/DPO/Reward/RLOO/GRPO) started following semver; the 0.x
    # line broke this package's call sites in four separate minors.
    "trl>=1.0,<2",
    # peft below 0.18 is documented-incompatible with transformers 5 and declares no ceiling of its
    # own, so this floor is the only thing that keeps a resolver off it.
    "peft>=0.18,<1",
    "datasets>=4.0,<6",
    "accelerate>=1.4,<2",
]
all = [
    "strata-forge[redis,multimodal,inspect,compute,serving,storage,finetuning,langfuse,hf,evals,rag,bedrock]",
]

[project.scripts]
# Only the distribution-qualified name is installed: a bare `forge` binary would collide on PATH
# with any other package shipping one (the generic name is already taken on PyPI).
strata-forge = "strata_forge.cli.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_forge"]
# CLAUDE.md files are agent instructions for THIS repo, not user documentation, and they carry
# internal links that dangle once installed. The per-module README.md files stay — they document
# the public surface.
exclude = ["**/CLAUDE.md", "**/AGENTS.md"]

# An sdist is published to a public index, so it is an ALLOW-list: only the package, the license,
# and the readme. Without this, hatchling's default sweeps in everything not VCS-ignored — the test
# suite, examples, notebooks, docs, CI config, the agent-instruction files, and the lockfile.
[tool.hatch.build.targets.sdist]
# `only-include` (not `include`) is the strict allow-list: everything outside these paths is
# dropped. README / LICENSE / NOTICE / pyproject.toml / PKG-INFO are added by hatchling itself.
only-include = ["src/strata_forge"]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/.env*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-recording>=0.13",
    "hypothesis>=6.115",
    "syrupy>=4.7",
    "respx>=0.21",
    "pre-commit>=4.0",
    "marimo>=0.10",
    # Optional runtime extras pulled into dev so unit tests can exercise
    # multimodal helpers, the Redis cache backend, etc. without forcing
    # users to install them in production.
    "pillow>=11.0",
]

# ----------------------------- ruff -----------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtin-shadowing
    "C4",           # comprehensions
    "PIE",          # misc
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ASYNC",        # async
    "S",            # bandit
    "PT",           # pytest
    "TID",          # tidy imports
    "TCH",          # type-checking blocks
    "PTH",          # use pathlib
    "ERA",          # eradicate dead code
]
ignore = [
    "E501",  # line length is handled by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT004", "S105", "S106", "S107"]
"examples/**/*.py" = ["S101", "T201"]
"scripts/**/*.py" = ["S101", "T201"]
# marimo notebooks: a cell's trailing bare expression is its rendered output.
"notebooks/**/*.py" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["strata_forge"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Option/Argument are the documented way to declare CLI params.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

# ----------------------------- pyright -----------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "strict"
strict = ["src/strata_forge"]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

# ----------------------------- pytest -----------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "live: requires live API keys (skipped by default)",
    "redis: requires a running Redis instance",
    "slow: long-running test",
    "integration: requires the local Docker stack",
]

# ----------------------------- coverage -----------------------------
[tool.coverage.run]
source = ["src/strata_forge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
# Minimum overall line coverage. Per-module thresholds (e.g. llm/ >= 90%) are
# enforced inside the suite where appropriate.
fail_under = 85
