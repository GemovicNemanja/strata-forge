  # =========================================================================
  # OpenAI GPT-6 family
  # =========================================================================

  # Source: developers.openai.com/api/docs/models/gpt-6-astra,
  # developers.openai.com/api/docs/models/gpt-6.1-sol and
  # developers.openai.com/api/docs/models/gpt-6-luna (verified 2026-10-01).
  # Prices are the base rates; a prompt above 272K input tokens bills the
  # whole request at 2x input and cache rates and 1.5x output, which the
  # registry does not model. The `openai` provider calls Chat Completions.
  - name: gpt-6-astra
    vendor: openai
    tier: flagship
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
    pricing_per_million_tokens:
      input: 10.00
      output: 50.00
      cache_read: 1.00
      cache_write: 12.50
    routes:
      - provider: openai
        provider_model_id: gpt-6-astra
        is_default: true

  # "Use the Responses API for tool calling. Chat Completions is supported
  # without tool calling." (vendor model page). Tool calling is therefore off
  # for this entry: a call with tools fails pre-flight with
  # `capability_missing` instead of reaching the provider.
  - name: gpt-6.1-sol
    vendor: openai
    tier: balanced
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: false
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
    pricing_per_million_tokens:
      input: 2.00
      output: 10.00
      cache_read: 0.10
      cache_write: 2.50
    routes:
      - provider: openai
        provider_model_id: gpt-6.1-sol
        is_default: true

  # "Chat Completions supports function calling only with `reasoning_effort`
  # set to `none`." (vendor model page). The route sends that effort on every
  # call that carries tools; a call without tools keeps the default effort.
  - name: gpt-6-luna
    vendor: openai
    tier: fast
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
    pricing_per_million_tokens:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
    routes:
      - provider: openai
        provider_model_id: gpt-6-luna
        is_default: true
        tool_call_reasoning_effort: none

