# Forge model registry — the curated source of truth for what Forge can call.
#
# Scope: latest foundation models from Anthropic, OpenAI, and Google (per
# docs/architecture/adr/0004-model-registry-scope.md). Adding new vendors
# requires a superseding ADR.
#
# Pricing values are in USD per million tokens. Lines with `# TBD verify`
# are reasonable estimates pending confirmation against the vendor's
# public pricing page.
#
# This file is also the allowlist for the vendor-native routes (`anthropic`,
# `openai`, ...): `routing.resolve()` refuses any model id that is not
# registered here unless the caller pins `openai_compat`. Every id, limit and
# price below is copied from the vendor's own documentation, never from
# memory or a third-party catalog; each entry's source comment names the page.

models:
  # =========================================================================
  # Anthropic Claude 5.x
  # =========================================================================

  # Source: platform.claude.com/docs/en/about-claude/models/overview and
  # platform.claude.com/docs/en/about-claude/pricing (verified 2026-10-01).
  # cache_write is the 5-minute cache write, as for every Claude entry.
  # Thinking is adaptive and always on for Fable 5.1 and Opus 5.5, and every
  # Claude 5.x model below rejects forced tool use (`tool_choice` any/tool)
  # with a 400. Structured output here is emulated through a forced tool
  # call, so `structured_output` is false for all three; plain tool calling
  # (`tool_choice` auto) is supported.
  - name: claude-fable-5-1
    vendor: anthropic
    tier: reasoning
    context_window: 1000000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: false
      streaming: true
      vision: true
      prompt_caching: true
    pricing_per_million_tokens:
      input: 10.00
      output: 50.00
      cache_read: 0.25
      cache_write: 12.50
    routes:
      - provider: anthropic
        provider_model_id: claude-fable-5-1
        is_default: true
      - provider: bedrock
        provider_model_id: anthropic.claude-fable-5-1
      - provider: vertex
        provider_model_id: claude-fable-5-1
    aliases: [fable-5.1]

  - name: claude-opus-5-5
    vendor: anthropic
    tier: flagship
    context_window: 1000000
    max_output_tokens: 128000
    modalities: [text, image]
