  # =========================================================================
  # OpenAI GPT-6 family
  # =========================================================================

  # Source: developers.openai.com/api/docs/models/gpt-6-astra,
  # developers.openai.com/api/docs/models/gpt-6.1-sol,
  # developers.openai.com/api/docs/models/gpt-6-luna, the GPT-6 guide
  # (developers.openai.com/api/docs/guides/latest-model) and the reasoning
  # guide (developers.openai.com/api/docs/guides/reasoning), all verified
  # 2026-10-01. Prices are the base rates; a prompt above 272K input tokens
  # bills the whole request at 2x input and cache rates and 1.5x output, which
  # the registry does not model.
  #
  # Every OpenAI route speaks the Responses API. "GPT-6 Astra and GPT-6.1 Sol
  # support Chat Completions, but tool calling requires Responses. GPT-6 Sol
  # and GPT-6 Luna support function calling in Chat Completions only with
  # `reasoning_effort: "none"`. Use Responses for reasoning with tools." (GPT-6
  # guide), so `tool_calling` is true for all three on that wire. "When
  # reasoning effort is not `none`, remove `temperature`, `top_p`, and
  # `top_logprobs`" (GPT-6 guide), and all three default to a reasoning effort
  # other than `none`, so `sampling_params` is false.
  #
  # Astra: "reasoning.effort supports low, medium, high, xhigh, and max"
  # (model page); "Chat Completions does not support function calling with
  # GPT-6 Astra or GPT-6.1 Sol" (reasoning guide).
  - name: gpt-6-astra
    vendor: openai
    tier: flagship
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    pricing_per_million_tokens:
      input: 10.00
      output: 50.00
      cache_read: 1.00
      cache_write: 12.50
    routes:
      - provider: openai
        provider_model_id: gpt-6-astra
        is_default: true
        wire_api: responses

  # Sol: "Use the Responses API for tool calling. Chat Completions is supported
  # without tool calling." and "reasoning.effort supports low, medium
  # (default), high, xhigh, and max" (model page).
  - name: gpt-6.1-sol
    vendor: openai
    tier: balanced
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    pricing_per_million_tokens:
      input: 2.00
      output: 10.00
      cache_read: 0.10
      cache_write: 2.50
    routes:
      - provider: openai
        provider_model_id: gpt-6.1-sol
        is_default: true
        wire_api: responses

  # Luna: "Use the Responses API for built-in tools and function calling. Chat
  # Completions supports function calling only with `reasoning_effort` set to
  # `none`." and "reasoning.effort supports none, low, medium (default), high,
  # xhigh, and max" (model page). On the Responses API it calls tools at any
  # effort, so the route pins no effort.
  - name: gpt-6-luna
    vendor: openai
    tier: fast
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    pricing_per_million_tokens:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
    routes:
      - provider: openai
        provider_model_id: gpt-6-luna
        is_default: true
        wire_api: responses

  # =========================================================================
  # OpenAI GPT-5.5 family
  # =========================================================================

  # Source: developers.openai.com/api/docs/models/gpt-5.5 (verified
  # 2026-10-01): Chat Completions and Responses both supported,
  # "Reasoning.effort supports: none, low, medium (default), high and xhigh",
  # 1,050,000 context window, 128,000 max output tokens. "Starting with
  # GPT-5.4, Chat Completions does not support tool calling with
  # `reasoning_effort` values other than `none`" (developers.openai.com/api/
  # docs/guides/migrate-to-responses), so tools need the Responses API at the
  # default effort. Azure lists gpt-5.5 for the Responses API
  # (learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses).
  - name: gpt-5.5
    vendor: openai
    tier: flagship
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    pricing_per_million_tokens:
      input: 5.00
      output: 30.00
      cache_read: 0.50
    routes:
      - provider: openai
        provider_model_id: gpt-5.5
        is_default: true
        wire_api: responses
      - provider: azure
        provider_model_id: gpt-5.5
        wire_api: responses
    aliases: [gpt55]

  # Source: developers.openai.com/api/docs/models/gpt-5.5-pro (verified
  # 2026-10-01): Chat Completions "Not supported", Responses supported,
  # "Reasoning.effort supports: medium, high (default) and xhigh", 1,050,000
  # context window, 128,000 max output tokens. Azure's Responses API model
  # list does not include gpt-5.5-pro, so its `azure` route is unverified and
  # left on Chat Completions until Azure documents the model.
  - name: gpt-5.5-pro
    vendor: openai
    tier: reasoning
    context_window: 1050000
    max_output_tokens: 128000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    pricing_per_million_tokens:
      input: 30.00
      output: 180.00
    routes:
      - provider: openai
        provider_model_id: gpt-5.5-pro
        is_default: true
        wire_api: responses
      - provider: azure
        provider_model_id: gpt-5.5-pro
    aliases: [gpt55-pro]

  # Placeholder: served by o4-mini, which supports Chat Completions and
  # Responses (developers.openai.com/api/docs/models/o4-mini, verified
  # 2026-10-01; Azure lists o4-mini for the Responses API). o4-mini is a
  # reasoning model with no `none` effort, so `sampling_params` is false.
  - name: gpt-5.5-thinking
    vendor: openai
    tier: reasoning
    context_window: 400000
    max_output_tokens: 32000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: false
    # GPT-5.5 Thinking is the thinking-mode variant of standard 5.5; base
    # token pricing matches standard, thinking tokens bill at the output rate.
    pricing_per_million_tokens:
      input: 5.00
      output: 30.00
      cache_read: 0.50
    routes:
      - provider: openai
        provider_model_id: o4-mini  # reasoning-class small model; 5.5-thinking not yet released
        is_default: true
        wire_api: responses
      - provider: azure
        provider_model_id: o4-mini
        wire_api: responses
    aliases: [gpt55-thinking]

  # Placeholder: served by gpt-5.4-nano, which supports Chat Completions and
  # Responses and whose "Reasoning.effort supports: none (default), low,
  # medium, high and xhigh" (developers.openai.com/api/docs/models/
  # gpt-5.4-nano, verified 2026-10-01; Azure lists it for the Responses API).
  # Its default effort is `none`, so it takes `temperature` / `top_p`.
  - name: gpt-5.5-instant
    vendor: openai
    tier: fast
    context_window: 128000
    max_output_tokens: 16000
    modalities: [text, image]
    capabilities:
      tool_calling: true
      structured_output: true
      streaming: true
      vision: true
      prompt_caching: true
      sampling_params: true
    pricing_per_million_tokens:
      input: 1.25   # TBD verify
      output: 10.00 # TBD verify
      cache_read: 0.125  # TBD verify
    routes:
      - provider: openai
        provider_model_id: gpt-5.4-nano  # cheapest current SKU; 5.5-instant not yet released
        is_default: true
        wire_api: responses
      - provider: azure
        provider_model_id: gpt-5.4-nano
        wire_api: responses
    aliases: [gpt55-instant]

